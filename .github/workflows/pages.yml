name: Test and deploy Puente

on:
  push:
    branches: [main, v070-bootstrap]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: puente-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply direct source bootstrap when present
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G '.deploy/direct-source.part-*' > /dev/null; then
            cat .deploy/direct-source.part-* > /tmp/direct-source.sh
            bash /tmp/direct-source.sh
            rm -rf .deploy
            echo "PUENTE_BOOTSTRAP_APPLIED=1" >> "$GITHUB_ENV"
          elif [ -f .deploy/direct-source.sh ]; then
            bash .deploy/direct-source.sh
            rm -rf .deploy
            echo "PUENTE_BOOTSTRAP_APPLIED=1" >> "$GITHUB_ENV"
          fi

      - name: Normalize bootstrap transcription artifacts
        if: env.PUENTE_BOOTSTRAP_APPLIED == '1'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('tests/03-speicher-phasen-postausgang.js')
          s=p.read_text(encoding='utf-8')
          bad="rep.push('[START] '+(await page.evaluate(()=>document.querySelector('.next-step h1')?.textContent||'KEIN next-step'));"
          good="rep.push('[START] '+(await page.evaluate(()=>document.querySelector('.next-step h1')?.textContent||'KEIN next-step')));"
          if bad in s:
              s=s.replace(bad,good)
              p.write_text(s,encoding='utf-8')
              print('Repaired tests/03 START assertion')

          p=Path('features.js')
          s=p.read_text(encoding='utf-8')
          old='''  async function ensureQrLib() {\n    await ensureLib("QRCode", "vendor/qrcode.min.js",\n      "https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js");\n  }'''
          new='''  function installQrToCanvasCompat() {\n    const QR=window.QRCode;\n    if(!QR || QR.toCanvas) return;\n    QR.toCanvas=function(canvas,text,opts={},cb){\n      const work=new Promise((resolve,reject)=>{\n        let holder;\n        try{\n          const size=Math.max(64,Number(opts.width)||256);\n          holder=document.createElement("div");\n          holder.style.cssText="position:absolute;left:-10000px;top:-10000px;width:1px;height:1px;overflow:hidden";\n          document.body.appendChild(holder);\n          new QR(holder,{text:String(text),width:size,height:size,correctLevel:QR.CorrectLevel?.M});\n          const source=holder.querySelector("canvas");\n          if(!source) throw new Error("QR canvas unavailable");\n          canvas.width=size; canvas.height=size;\n          const ctx=canvas.getContext("2d");\n          if(!ctx) throw new Error("Canvas 2D unavailable");\n          ctx.clearRect(0,0,size,size); ctx.drawImage(source,0,0,size,size);\n          holder.remove(); holder=null;\n          resolve(canvas);\n        }catch(err){\n          try{holder?.remove();}catch(_){}\n          reject(err);\n        }\n      });\n      if(typeof cb==="function") work.then(()=>cb(null),cb);\n      return work;\n    };\n  }\n\n  async function ensureQrLib() {\n    await ensureLib("QRCode", "vendor/qrcode.min.js",\n      "https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js");\n    installQrToCanvasCompat();\n  }'''
          if old not in s:
              raise SystemExit('Expected ensureQrLib block not found')
          p.write_text(s.replace(old,new),encoding='utf-8')

          p=Path('README.md')
          s=p.read_text(encoding='utf-8').replace('QRCode 1.5.3','QRCode.js 1.0.0')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Syntax and extraction tests
        run: |
          set -euo pipefail
          for f in storage.js voice.js capture.js data.js features.js app.js sw.js tests/*.js; do node --check "$f"; done
          node tests/00-datenintegritaet.js
          node tests/06-capture.js

      - name: Prepare same-origin runtime assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='_site' --exclude='release' --exclude='.deploy' \
            --exclude='chunks' --exclude='loader.js' \
            --exclude='styles-base.css' --exclude='styles-mobile.css' --exclude='styles-workspace.css' \
            ./ _site/
          mkdir -p _site/vendor/pdfjs _site/vendor/tesseract/lang _site/vendor/tesseract-core _site/vendor/whisper

          if [ -s vendor/pdf-lib.min.js ]; then
            cp vendor/pdf-lib.min.js _site/vendor/pdf-lib.min.js
          else
            curl --fail --location --retry 4 --retry-all-errors \
              https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js \
              -o _site/vendor/pdf-lib.min.js
          fi

          # The qrcode package does not ship the historical build/qrcode.min.js browser file.
          # Use the real, versioned QRCode.js browser artifact and add a toCanvas-compatible adapter.
          curl --fail --location --retry 4 --retry-all-errors \
            https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js \
            -o _site/vendor/qrcode.min.js
          cat >> _site/vendor/qrcode.min.js <<'QRADAPTER'
          ;(function(QR){if(!QR||QR.toCanvas)return;QR.toCanvas=function(canvas,text,opts,cb){opts=opts||{};var work=new Promise(function(resolve,reject){var holder;try{var size=Math.max(64,Number(opts.width)||256);holder=document.createElement('div');holder.style.cssText='position:absolute;left:-10000px;top:-10000px;width:1px;height:1px;overflow:hidden';document.body.appendChild(holder);new QR(holder,{text:String(text),width:size,height:size,correctLevel:QR.CorrectLevel&&QR.CorrectLevel.M});var source=holder.querySelector('canvas');if(!source)throw new Error('QR canvas unavailable');canvas.width=size;canvas.height=size;var ctx=canvas.getContext('2d');if(!ctx)throw new Error('Canvas 2D unavailable');ctx.clearRect(0,0,size,size);ctx.drawImage(source,0,0,size,size);holder.remove();holder=null;resolve(canvas)}catch(err){try{if(holder)holder.remove()}catch(_){}reject(err)}});if(typeof cb==='function')work.then(function(){cb(null)},cb);return work}})(window.QRCode);
          QRADAPTER
          test -s _site/vendor/qrcode.min.js
          grep -q 'toCanvas' _site/vendor/qrcode.min.js

          curl --fail --location --retry 4 --retry-all-errors \
            https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js \
            -o _site/vendor/jszip.min.js

          curl --fail --location --retry 4 --retry-all-errors \
            https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js \
            -o _site/vendor/pdfjs/pdf.min.js
          curl --fail --location --retry 4 --retry-all-errors \
            https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js \
            -o _site/vendor/pdfjs/pdf.worker.min.js

          curl --fail --location --retry 4 --retry-all-errors \
            https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js \
            -o _site/vendor/tesseract/tesseract.min.js
          curl --fail --location --retry 4 --retry-all-errors \
            https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js \
            -o _site/vendor/tesseract/worker.min.js
          for core in tesseract-core.wasm.js tesseract-core-simd.wasm.js tesseract-core-lstm.wasm.js tesseract-core-simd-lstm.wasm.js; do
            curl --fail --location --retry 4 --retry-all-errors \
              "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1/$core" \
              -o "_site/vendor/tesseract-core/$core" \
            || curl --fail --location --retry 4 --retry-all-errors \
              "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.0.0/$core" \
              -o "_site/vendor/tesseract-core/$core"
          done
          for lang in deu spa eng; do
            curl --fail --location --retry 4 --retry-all-errors \
              "https://cdn.jsdelivr.net/npm/@tesseract.js-data/${lang}@1.0.0/4.0.0_best_int/${lang}.traineddata.gz" \
              -o "_site/vendor/tesseract/lang/${lang}.traineddata.gz" \
            || curl --fail --location --retry 4 --retry-all-errors \
              "https://tessdata.projectnaptha.com/4.0.0_fast/${lang}.traineddata.gz" \
              -o "_site/vendor/tesseract/lang/${lang}.traineddata.gz"
          done

          curl --fail --location --retry 4 --retry-all-errors \
            https://raw.githubusercontent.com/Prozectz/Whisper.cpp/354aad88c3f8fd274808c21f6bb686a1495979b4/main.js \
            -o _site/vendor/whisper/main.js
          grep -q 'full_default' _site/vendor/whisper/main.js
          grep -q 'init' _site/vendor/whisper/main.js
          curl --fail --location --retry 4 --retry-all-errors \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/f281eb45af861ab5e5297d23694b7d46e090c02c/ggml-tiny-q5_1.bin \
            -o _site/vendor/whisper/ggml-tiny-q5_1.bin
          test "$(stat -c%s _site/vendor/whisper/ggml-tiny-q5_1.bin)" -gt 25000000
          echo "818710568da3ca15689e31a743197b520007872ff9576237bda97bd1b469c3d7  _site/vendor/whisper/ggml-tiny-q5_1.bin" | sha256sum -c -

          for f in \
            vendor/pdf-lib.min.js vendor/qrcode.min.js vendor/jszip.min.js \
            vendor/pdfjs/pdf.min.js vendor/pdfjs/pdf.worker.min.js \
            vendor/tesseract/tesseract.min.js vendor/tesseract/worker.min.js \
            vendor/tesseract/lang/deu.traineddata.gz vendor/tesseract/lang/spa.traineddata.gz vendor/tesseract/lang/eng.traineddata.gz \
            vendor/whisper/main.js vendor/whisper/ggml-tiny-q5_1.bin; do
            test -s "_site/$f"
          done

      - name: QR browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          cat > _site/qr-smoke.html <<'HTML'
          <!doctype html><meta charset="utf-8"><body data-qr="pending"><canvas id="q"></canvas>
          <script src="vendor/qrcode.min.js"></script><script>
          QRCode.toCanvas(document.getElementById('q'),'Puente QR smoke',{width:180,margin:1}).then(function(){document.body.dataset.qr='ok'}).catch(function(){document.body.dataset.qr='fail'});
          </script></body>
          HTML
          python3 -m http.server 8123 --directory _site >/tmp/puente-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then echo 'Chromium not present on runner'; exit 1; fi
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8123/qr-smoke.html > /tmp/qr-dom.html
          grep -q 'data-qr="ok"' /tmp/qr-dom.html
          rm -f _site/qr-smoke.html

      - name: Static application smoke checks
        run: |
          set -euo pipefail
          grep -q 'capture.js' _site/index.html
          grep -q 'puente-coi-reload' _site/index.html
          grep -q 'Cross-Origin-Embedder-Policy' _site/sw.js
          grep -q 'vendor/whisper/main.js' _site/capture.js
          grep -q 'ggml-tiny-q5_1.bin' _site/capture.js
          grep -q 'vendor/qrcode.min.js' _site/features.js
          grep -q 'qrcodejs@1.0.0' _site/features.js
          grep -q 'bank_card' _site/capture.js
          grep -q 'health_card' _site/capture.js
          grep -q 'extractSpokenFacts' _site/capture.js

      - name: Browser regression tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/puente-node
          mkdir -p /tmp/puente-node
          cd /tmp/puente-node
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 pdf-lib@1.17.1
          npx playwright install --with-deps chromium
          export NODE_PATH=/tmp/puente-node/node_modules
          cd "$GITHUB_WORKSPACE"
          sudo mkdir -p /home/claude
          sudo rm -rf /home/claude/app
          sudo ln -s "$GITHUB_WORKSPACE" /home/claude/app
          NODE_PATH="$NODE_PATH" node - <<'NODE'
          const fs=require('fs');
          const {PDFDocument}=require('pdf-lib');
          (async()=>{
            const p=await PDFDocument.create(); p.addPage([595,842]);
            const form=p.getForm();
            form.createTextField('Vorname').addToPage(p.getPage(0),{x:40,y:760,width:180,height:24});
            form.createTextField('Nachname').addToPage(p.getPage(0),{x:240,y:760,width:180,height:24});
            form.createTextField('Geburtsdatum').addToPage(p.getPage(0),{x:40,y:710,width:180,height:24});
            form.createTextField('IBAN').addToPage(p.getPage(0),{x:40,y:660,width:380,height:24});
            form.createTextField('Steuer-ID').addToPage(p.getPage(0),{x:40,y:610,width:180,height:24});
            form.createTextField('Wohnfläche').addToPage(p.getPage(0),{x:240,y:610,width:180,height:24});
            fs.writeFileSync('/home/claude/testformular.pdf',await p.save());
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          NODE_PATH="$NODE_PATH" node tests/01-grundfunktionen.js "$GITHUB_WORKSPACE"
          NODE_PATH="$NODE_PATH" node tests/02-fristen-bescheid-beratung.js
          NODE_PATH="$NODE_PATH" node tests/03-speicher-phasen-postausgang.js
          NODE_PATH="$NODE_PATH" node tests/04-speicherstufen.js
          NODE_PATH="$NODE_PATH" node tests/05-pdf-ausfuellen.js

      - name: Persist tested source and offline runtime assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor
          cp -a _site/vendor vendor
          rm -rf release .deploy chunks loader.js styles-base.css styles-mobile.css styles-workspace.css
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publish tested Puente v0.7.0 source and offline runtime [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - uses: actions/configure-pages@v5
        if: github.ref_name == 'main'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.ref_name == 'main'
        with:
          path: _site

  deploy:
    if: github.ref_name == 'main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
